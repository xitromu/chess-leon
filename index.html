<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#dcd2ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Шахматы с Леоном</title>
<style>
  :root {
    --bg1: #e6dcff; --bg2: #bfe3ff; --ink: #3d2f7a; --card: #fff;
    --light: #f3efff; --dark: #a99be0; --gold: #f5a400;
    --bs: min(calc(100vw - 44px), 440px, calc(100vh - 330px));
  }
  @supports (height: 100dvh) { :root { --bs: min(calc(100vw - 44px), 440px, calc(100dvh - 330px)); } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; }
  body {
    background: linear-gradient(var(--bg1), var(--bg2)) fixed; color: var(--ink);
    font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  button { font: inherit; color: inherit; }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }
  .screen { display: none; flex-direction: column; min-height: 100vh; padding-bottom: 12px; }
  .screen.on { display: flex; }

  .top { display: flex; align-items: center; gap: 8px; padding: 10px 12px 4px; }
  .ttl { flex: 1; font-weight: 800; font-size: clamp(14px, 4.2vw, 17px); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ib { border: 0; background: #fff; border-radius: 14px; width: 42px; height: 42px; font-size: 21px; cursor: pointer; box-shadow: 0 2px 6px #4b3a8f22; flex: none; }
  .wallet { display: flex; align-items: center; gap: 5px; background: #fff; border-radius: 20px; padding: 5px 12px 5px 7px; font-weight: 800; font-size: 19px; position: relative; box-shadow: 0 2px 6px #4b3a8f22; flex: none; }
  .wallet svg { width: 24px; height: 24px; }
  .float { position: absolute; right: 4px; top: -4px; color: var(--gold); font-weight: 900; font-size: 20px; animation: up 1.1s ease-out forwards; pointer-events: none; }
  @keyframes up { to { transform: translateY(-38px); opacity: 0; } }

  .bubble {
    position: relative; background: #fff; border-radius: 18px; padding: 10px 13px; font-size: 17px; font-weight: 650; line-height: 1.3;
    box-shadow: 0 3px 10px #4b3a8f22; min-height: 48px; cursor: pointer;
  }
  .bubble:empty { visibility: hidden; }

  /* меню */
  .hero { display: flex; align-items: flex-end; gap: 6px; padding: 4px 14px 2px; }
  .hero .leon { width: 150px; height: 150px; flex: none; }
  .hero .bubble { margin-bottom: 70px; flex: 1; }
  .pair { position: relative; flex: none; }
  .pair .malon { position: absolute; z-index: 1; }
  .hero .pair { width: 150px; height: 150px; }
  .hero .pair.wm { width: 178px; }
  .hero .pair .malon { left: 104px; bottom: -4px; width: 74px; height: 74px; }
  .hcol { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding-bottom: 4px; min-width: 0; }
  .hcol .bubble { margin-bottom: 0; flex: none; }
  .feedbtn { border: 0; border-radius: 16px; padding: 10px 8px; font-size: 16px; font-weight: 800; background: #42c860; color: #fff; box-shadow: 0 3px 0 #2c9846; cursor: pointer; }
  .feedbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #2c9846; }
  .hero .bubble::after { content: ""; position: absolute; left: -9px; bottom: 14px; border: 9px solid transparent; border-right-color: #fff; border-left: 0; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 6px 14px; }
  .card { background: #fff; border: 0; border-radius: 18px; padding: 10px 4px 8px; text-align: center; cursor: pointer; box-shadow: 0 3px 8px #4b3a8f22; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .card:active { transform: scale(.96); }
  .card .ic { height: 38px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
  .card .ic svg { width: 34px; height: 34px; }
  .card .ic .tx { font-weight: 900; font-size: 20px; background: var(--light); border-radius: 8px; padding: 1px 6px; }
  .card b { font-size: 13px; line-height: 1.15; min-height: 30px; display: flex; align-items: center; }
  .card i { font-style: normal; font-size: 14px; color: var(--gold); letter-spacing: 1px; }
  .card .num { position: absolute; }
  .sect { grid-column: 1 / -1; font-weight: 800; font-size: 13px; opacity: .7; margin: 4px 2px -4px; }

  /* урок */
  .host { display: flex; align-items: center; gap: 4px; padding: 2px 12px; min-height: 104px; }
  .host .pair, .host .pair .leon { width: 96px; height: 96px; }
  .host .pair.wm { width: 112px; }
  .host .pair .malon { left: 62px; bottom: -4px; width: 50px; height: 50px; }
  .host .bubble { flex: 1; max-height: 150px; overflow-y: auto; font-size: 16px; }
  .host .bubble::after { content: ""; position: absolute; left: -9px; top: 50%; margin-top: -9px; border: 9px solid transparent; border-right-color: #fff; border-left: 0; }
  .bwrap { display: grid; grid-template-columns: 18px var(--bs); grid-template-rows: var(--bs) 20px; justify-content: center; margin-top: 4px; }
  .ranks { display: flex; flex-direction: column; }
  .ranks div, .files div { flex: 1; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; opacity: .75; border-radius: 6px; transition: background .3s; }
  .files { display: flex; grid-column: 2; }
  .ranks div.glow, .files div.glow { background: #ffe066; opacity: 1; }
  .board { position: relative; width: var(--bs); height: var(--bs); border-radius: 10px; overflow: hidden; box-shadow: 0 4px 14px #4b3a8f40; touch-action: none; cursor: pointer; }
  .sqs { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); }
  .sq { position: relative; }
  .sq.l { background: var(--light); } .sq.d { background: var(--dark); }
  .sq.last::before { content: ""; position: absolute; inset: 0; background: #ffe06670; }
  .sq.sel::before { content: ""; position: absolute; inset: 0; background: #ffd23f; }
  .sq.mv::after { content: ""; position: absolute; left: 34%; top: 34%; width: 32%; height: 32%; border-radius: 50%; background: #4b3a8f55; }
  .sq.cap::after { content: ""; position: absolute; inset: 6%; border-radius: 50%; border: 4px solid #4b3a8f66; }
  .sq.mark::before { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 4px #ff5a5a; background: #ff5a5a30; }
  .sq.hint::before { content: ""; position: absolute; inset: 0; background: #ffb300aa; animation: blink 1s ease-in-out infinite; }
  .sq.ok::before { content: ""; position: absolute; inset: 0; background: #42c860aa; animation: fade .8s forwards; }
  .sq.no::before { content: ""; position: absolute; inset: 0; background: #ff5a5aaa; animation: fade .8s forwards; }
  .sq .nm { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: calc(var(--bs) / 22); color: #fff; text-shadow: 0 1px 3px #000a; animation: fade 1.4s forwards; z-index: 3; pointer-events: none; }
  @keyframes blink { 50% { opacity: .35; } }
  @keyframes fade { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }
  .pcs { position: absolute; inset: 0; pointer-events: none; }
  .pc { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; transition: transform .28s ease, opacity .3s; z-index: 2; }
  .pc svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 2px 1px #0003); }
  .pc.pop svg { animation: pop .3s ease-out; }
  .pc.gone { opacity: 0; }
  @keyframes pop { from { transform: scale(.2); } 70% { transform: scale(1.15); } to { transform: scale(1); } }
  .fly { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; z-index: 4; transition: transform .3s, opacity .3s; }
  .fly svg { width: 100%; height: 100%; animation: buzz .25s ease-in-out infinite alternate; }
  .fly.eaten { opacity: 0; }
  .fly.eaten svg { animation: none; transform: scale(.1); transition: transform .3s; }
  @keyframes buzz { from { transform: rotate(-8deg) translateY(-2%); } to { transform: rotate(8deg) translateY(2%); } }
  .arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }

  .act { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; padding: 10px 12px 0; min-height: 70px; }
  .btn { border: 0; border-radius: 18px; padding: 13px 20px; font-size: 19px; font-weight: 800; cursor: pointer; background: #fff; box-shadow: 0 3px 0 #4b3a8f33; min-width: 64px; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #4b3a8f33; }
  .btn.next { background: #6c5ce7; color: #fff; box-shadow: 0 3px 0 #4434b5; padding: 13px 34px; }
  .btn.choice { font-size: 22px; min-width: 84px; }
  .btn.yes { background: #42c860; color: #fff; box-shadow: 0 3px 0 #2c9846; }
  .btn.no { background: #ff6b6b; color: #fff; box-shadow: 0 3px 0 #d04545; }
  .btn.right { background: #42c860; color: #fff; }
  .btn.wrongb { background: #ffd0d0; opacity: .6; }
  .btn.soft { background: #fff7d6; }
  .tray { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; background: #fff; border-radius: 18px; padding: 6px 16px; }
  .tray svg { width: 46px; height: 46px; }

  /* Леон */
  .leon svg, .malon svg, .tleon svg, .tmalon svg { width: 100%; height: 100%; overflow: visible; display: block; }
  svg.idle { animation: breathe 3s ease-in-out infinite; transform-origin: 50% 100%; }
  svg.hop { animation: hop .45s ease-out 2; transform-origin: 50% 100%; }
  svg.sad { animation: droop .6s ease-out forwards; transform-origin: 50% 100%; }
  svg.chew { animation: chew .16s ease-in-out 4; transform-origin: 50% 100%; }
  @keyframes chew { 50% { transform: scale(1.05, .92); } }

  /* террариум */
  .tbox { position: relative; margin: 6px 10px 0; height: min(330px, 46vh); border-radius: 22px; border: 6px solid #cfe9ff; background: linear-gradient(#e2f8dc, #c4ecb6 74%, #e8d29a 74%); box-shadow: inset 0 0 0 2px #fff8, 0 4px 12px #0002; overflow: hidden; }
  .tbox .decor { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tleon { position: absolute; left: 2%; bottom: calc(31% - 10px); width: min(150px, 44%); aspect-ratio: 1; z-index: 2; }
  .tmalon { position: absolute; right: 5%; bottom: 9%; width: min(96px, 28%); aspect-ratio: 1; z-index: 2; transition: opacity .3s; }
  .tmalon.off { opacity: 0; }
  .tbox .tongue { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; overflow: visible; }
  .tbox .food { position: absolute; left: 0; top: 0; width: 44px; height: 44px; z-index: 4; pointer-events: none; }
  .tbox .food svg, .fd .ic svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .tbox .bubble { position: absolute; left: 38%; top: 8px; max-width: 58%; font-size: 15px; padding: 7px 11px; min-height: 0; z-index: 6; }
  .mtog, .buymalon { position: absolute; right: 8px; border: 0; border-radius: 12px; font-weight: 800; cursor: pointer; z-index: 6; box-shadow: 0 2px 6px #0002; }
  .mtog { bottom: calc(9% + 100px); padding: 5px 9px; font-size: 13px; background: #fff; }
  .buymalon { bottom: 12%; right: 4%; padding: 8px 10px; font-size: 15px; background: #ffd166; color: #5a3b0c; display: flex; align-items: center; gap: 4px; }
  .buymalon svg { width: 18px; height: 18px; }
  .ripple { position: absolute; width: 24px; height: 8px; border: 2px solid #fff; border-radius: 50%; z-index: 3; pointer-events: none; animation: ripple .9s ease-out forwards; }
  @keyframes ripple { to { transform: scale(3.2); opacity: 0; } }
  .heart { position: absolute; font-size: 22px; animation: heart 1.2s ease-out forwards; z-index: 6; pointer-events: none; }
  @keyframes heart { to { transform: translateY(-60px) scale(1.4); opacity: 0; } }
  .jar { margin: 8px 12px; background: #fff; border-radius: 20px; padding: 6px 6px 8px; box-shadow: 0 3px 8px #4b3a8f22; }
  .jt { text-align: center; font-weight: 800; font-size: 14px; margin: 2px 0 6px; }
  .foods { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .fd { background: #f5f2ff; border: 0; border-radius: 14px; padding: 5px 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
  .fd:active { transform: scale(.95); }
  .fd.poor { opacity: .5; }
  .fd .ic { width: 38px; height: 38px; }
  .fd b { font-size: 11px; line-height: 1.1; min-height: 24px; display: flex; align-items: center; text-align: center; }
  .fd span { font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 2px; }
  .fd span svg { width: 13px; height: 13px; }
  .wing { animation: flap .14s ease-in-out infinite alternate; transform-origin: 20px 20px; }
  @keyframes flap { to { transform: scaleX(.3); } }
  .wing2 { animation: flap2 .09s ease-in-out infinite alternate; transform-origin: 20px 20px; }
  @keyframes flap2 { to { transform: scaleY(.45); } }
  .wiggle { animation: wig .3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes wig { to { transform: scaleX(.85) skewX(10deg); } }
  .legs { animation: legs .18s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 100% 50%; }
  .legs2 { transform-origin: 0% 50%; animation-direction: alternate-reverse; }
  @keyframes legs { to { transform: rotate(14deg); } }
  .crawl { animation: crawl .35s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes crawl { to { transform: scaleX(.9) translateY(-4%); } }
  @keyframes breathe { 50% { transform: scale(1.025, .985); } }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-14%) scale(1.04); } }
  @keyframes droop { to { transform: translateY(3%) rotate(-3deg) scaleY(.96); } }

  /* гардероб */
  .items { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 6px 14px; }
  .item { position: relative; background: #fff; border: 0; border-radius: 18px; padding: 6px 4px 8px; cursor: pointer; box-shadow: 0 3px 8px #4b3a8f22; display: flex; flex-direction: column; align-items: center; }
  .item .pv { width: 74px; height: 74px; }
  .item b { font-size: 13px; line-height: 1.1; min-height: 29px; display: flex; align-items: center; text-align: center; }
  .item span { font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 3px; }
  .item span svg { width: 16px; height: 16px; }
  .item.own span { color: #2c9846; }
  .item.on { outline: 4px solid #ffb300; }
  .item.poor { opacity: .55; }
  .vbtn { display: block; margin: 16px auto 0; font-size: 16px; padding: 10px 18px; }
  .tiny { margin: 22px auto 8px; display: block; border: 0; background: none; color: #4b3a8f88; font-size: 13px; text-decoration: underline; cursor: pointer; }

  /* итог урока */
  .overlay { position: fixed; inset: 0; background: #2a1f5a99; display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .overlay.on { display: flex; }
  .res { background: linear-gradient(#fff, #f1ecff); border-radius: 26px; padding: 18px 18px 20px; width: 100%; max-width: 360px; text-align: center; }
  .res h2 { margin: 0 0 4px; font-size: 24px; }
  .res .pair { width: 150px; height: 150px; margin: 0 auto; }
  .res .pair.wm { width: 190px; }
  .res .pair .leon { width: 150px; height: 150px; }
  .res .pair .malon { left: 112px; bottom: 0; width: 78px; height: 78px; }
  .res .stars { font-size: 44px; color: var(--gold); letter-spacing: 4px; }
  .res .stars .off { color: #d7d0f0; }
  .res .got { font-size: 22px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 6px; margin: 4px 0 14px; }
  .res .got svg { width: 28px; height: 28px; }
  .res .row { display: flex; gap: 10px; justify-content: center; }
  .res .row .btn { flex: 1; padding: 13px 8px; white-space: nowrap; }
</style>
</head>
<body>
<div id="app">
  <section id="menu" class="screen on">
    <header class="top">
      <div class="wallet"></div>
      <div class="ttl">Шахматы с Леоном</div>
      <button class="ib" id="snd" title="Звук">🔊</button>
      <button class="ib" id="toShop" title="Гардероб">👕</button>
    </header>
    <div class="hero">
      <div class="pair"><div class="leon"></div><div class="malon"></div></div>
      <div class="hcol"><div class="bubble"></div><button class="feedbtn" id="toTerra">🌿 Покормить</button></div>
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <section id="lesson" class="screen">
    <header class="top">
      <button class="ib" id="back" title="Назад">←</button>
      <div class="ttl" id="lTitle"></div>
      <div class="wallet"></div>
    </header>
    <div class="host"><div class="pair"><div class="leon"></div><div class="malon"></div></div><div class="bubble" id="bubble"></div></div>
    <div class="bwrap">
      <div class="ranks" id="ranks"></div>
      <div class="board" id="board">
        <div class="sqs" id="sqs"></div>
        <div class="pcs" id="pcs"></div>
        <svg class="arrows" id="arrows" viewBox="0 0 8 8"></svg>
      </div>
      <div class="files" id="files"></div>
    </div>
    <div class="act" id="act"></div>
  </section>

  <section id="shop" class="screen">
    <header class="top">
      <button class="ib" id="shopBack" title="Назад">←</button>
      <div class="ttl">Гардероб Леона</div>
      <div class="wallet"></div>
    </header>
    <div class="hero"><div class="leon"></div><div class="bubble"></div></div>
    <div class="items" id="items"></div>
    <button class="btn soft vbtn" id="voiceBtn">🗣 Голос</button>
    <button class="tiny" id="reset">Сбросить прогресс</button>
  </section>

  <section id="terra" class="screen">
    <header class="top">
      <button class="ib" id="terraBack" title="Назад">←</button>
      <div class="ttl">Террариум</div>
      <div class="wallet"></div>
    </header>
    <div class="tbox" id="tbox">
      <svg class="decor" viewBox="0 0 300 300" preserveAspectRatio="none">
        <circle cx="268" cy="34" r="18" fill="#fff7c2" opacity=".85"/>
        <path d="M-4 212 Q90 194 186 210" stroke="#8a5a2b" stroke-width="11" fill="none" stroke-linecap="round"/>
        <path d="M150 204 Q170 186 182 170" stroke="#8a5a2b" stroke-width="6" fill="none" stroke-linecap="round"/>
        <ellipse cx="182" cy="166" rx="12" ry="6" fill="#3fa34d" transform="rotate(-40 182 166)"/>
        <ellipse cx="26" cy="200" rx="14" ry="7" fill="#3fa34d" transform="rotate(-25 26 200)"/>
        <ellipse cx="246" cy="283" rx="58" ry="22" fill="#a8a29a"/><ellipse cx="236" cy="276" rx="34" ry="9" fill="#c4bdb4"/>
        <path d="M10 300 Q20 250 14 226 M26 300 Q38 258 48 240 M292 300 Q284 252 294 228" stroke="#4caf50" stroke-width="6" fill="none" stroke-linecap="round"/>
        <circle cx="120" cy="290" r="5" fill="#d9c27e"/><circle cx="168" cy="294" r="4" fill="#d9c27e"/><circle cx="60" cy="292" r="3" fill="#d9c27e"/>
        <ellipse cx="141" cy="266" rx="52" ry="14" fill="#9ad8f5"/>
        <ellipse cx="141" cy="267" rx="47" ry="11" fill="#5fb8ea"/>
        <ellipse cx="128" cy="263" rx="16" ry="3" fill="#fff" opacity=".45"/>
        <circle cx="88" cy="270" r="4" fill="#b9b2a8"/><circle cx="194" cy="262" r="3.5" fill="#b9b2a8"/><circle cx="182" cy="275" r="3" fill="#a8a29a"/>
      </svg>
      <div class="tleon"></div><div class="tmalon"></div><svg class="tongue"></svg>
      <div class="bubble"></div>
      <button class="mtog" id="mtog">🦎 Малон: дома</button>
      <button class="buymalon" id="buyMalon"></button>
    </div>
    <div class="jar"><div class="jt">🫙 Банка с едой — нажми, и букашка выбежит</div><div class="foods" id="foods"></div></div>
  </section>

  <div class="overlay" id="result">
    <div class="res">
      <h2>Урок пройден!</h2>
      <div class="pair"><div class="leon"></div><div class="malon"></div></div>
      <div class="stars" id="rStars"></div>
      <div class="got" id="rGot"></div>
      <div class="row"><button class="btn" id="rAgain">↺ Ещё раз</button><button class="btn next" id="rMenu">Дальше ▶</button></div>
    </div>
  </div>
</div>

<script>
// ENGINE START
// Доска: массив из 64 клеток, индекс = ряд * 8 + вертикаль (a1 = 0, h8 = 63).
// Фигура: { t: 'P'|'N'|'B'|'R'|'Q'|'K', c: 'w'|'b', id }. st.ep — клетка для взятия на проходе или -1.
const FILES = 'abcdefgh';
const START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq -';
const sqName = s => FILES[s & 7] + ((s >> 3) + 1);
const sqIdx = n => FILES.indexOf(n[0]) + (n[1] - 1) * 8;
const opp = c => (c === 'w' ? 'b' : 'w');
let PID = 1;

function parseFEN(fen) {
  const [pl, turn = 'w', cast = '-', ep = '-'] = fen.split(' ');
  const b = Array(64).fill(null);
  pl.split('/').forEach((row, i) => {
    let f = 0;
    const r = 7 - i;
    for (const ch of row) {
      if (/\d/.test(ch)) f += +ch;

const LETTERS = { a: 'а', b: 'бэ', c: 'цэ', d: 'дэ', e: 'е', f: 'эф', g: 'жэ', h: 'аш' };

// у женских голосов есть вариант «пониже» — он и выбран, пока мужского нет (обычно так на Android)
const MALE = /pavel|павел|dmitr|дмитр|yuri|юрий|maxim|максим|male|мужск/i;
const RU_NAMES = { Pavel: 'Павел', Irina: 'Ирина', Dmitry: 'Дмитрий', Svetlana: 'Светлана', Yuri: 'Юрий', Milena: 'Милена', Katya: 'Катя' };
let VARS = [], VAR = null;  // варианты голоса: { v: голос браузера или null, pitch, label }
function voiceName(v, i) {
  const known = v.name.match(/Pavel|Irina|Dmitry|Svetlana|Yuri|Milena|Katya/);
  return known ? RU_NAMES[known[0]] : 'голос ' + (i + 1);
}
function pickVoice() {
  let vs = [];
  try { vs = speechSynthesis.getVoices().filter(v => /^ru/i.test(v.lang)); } catch (e) {}
  const score = v => (MALE.test(v.name) ? 2 : 0) + (/google|natural|online/i.test(v.name) ? 1 : 0);
  vs.sort((a, b) => score(b) - score(a));
  VARS = [];
  vs.forEach((v, i) => {
    const nm = voiceName(v, i);
    if (MALE.test(v.name)) VARS.push({ v, pitch: 1.05, label: nm });
    else VARS.push({ v, pitch: .8, label: nm + ', пониже' }, { v, pitch: 1.2, label: nm });
  });
  if (!VARS.length) VARS = [{ v: null, pitch: .8, label: 'пониже' }, { v: null, pitch: 1.2, label: 'обычный' }];

}

  await wait(quiet ? 300 : 1300);
}
async function tell(text, o = {}) {
  if (o.marks) marks(o.marks);
  if (o.arrows) o.arrows.forEach(([a, b, c]) => arrow(a, b, c));
  if (o.glow) o.glow();
  say(text, o.voice);
  await userButtons([{ label: o.btn || 'Дальше ▶', cls: 'next' }]);
  if (o.marks || o.arrows) { clearMarks('mark'); arrEl.innerHTML = ''; }
  document.querySelectorAll('.glow').forEach(d => d.classList.remove('glow'));
}
async function askSquare({ text, ok, hint, wrong, reward = [2, 1], quiet = false, name = false }) {
  if (text) say(text);
  let tries = 0;
  for (;;) {
    const sq = await userTap();
    if (ok(sq)) { flash(sq, 'ok'); clearMarks('hint'); await give(tries, reward, quiet); return sq; }
    tries++; L.errors++;
    flash(sq, 'no'); if (name) showName(sq);
    oops(wrong ? wrong(sq) : null);
    if (tries >= 2 && hint) marks(hint(), 'hint');
  }
}
async function askChoice({ text, options, wrong, reward = [2, 1] }) {
  if (text) say(text);
  let tries = 0;
  await waitable(res => {
    const a = $('#act'); a.innerHTML = '';
    options.forEach(o => {
      const el = document.createElement('button');
      el.className = 'btn choice ' + (o.cls || ''); el.innerHTML = o.label;
      el.onclick = () => {
        if (el.disabled) return;
        if (o.ok) { el.classList.add('right'); res(); }
        else { tries++; L.errors++; el.classList.add('wrongb'); el.disabled = true; oops(o.say || wrong); }
      };
      a.appendChild(el);
    });
  });
  await give(tries, reward);
  actions([]);
}
// hint: строка хода 'e2e4' или функция, возвращающая ход; showFrom — сразу подсветить фигуру
async function askMove({ text, accept, hint, wrong, wrongText, reward = [3, 1], showFrom = false, color, btns }) {
  if (text) say(text);
  const hm = () => { const h = typeof hint === 'function' ? hint() : hint; return typeof h === 'string' ? findMove(G.st, h) : h; };
  if (showFrom && hint) { const h = hm(); if (h) marks([h.from], 'hint'); }
  let tries = 0;
  for (;;) {
    if (btns) actions(btns(tries));
    const prev = G.st;
    const m = await userMove(color || G.st.turn);
    clearMarks('hint'); arrEl.innerHTML = '';
    await doMove(m);
    const r = accept(m, prev, G.st);
    if (r === true) { if (btns) actions([]); await give(tries, reward); return m; }
    tries++; L.errors++;
    const handled = wrong ? await wrong(m, prev) : false;
    if (!handled) oops(typeof r === 'string' ? r : (wrongText || null));
    await wait(900);
    G.st = prev; setLast(null); render();
    if (hint) {
      const h = (G.st = prev, hm());
      if (h) { marks([h.from], 'hint'); if (tries >= 2) arrow(h.from, h.to); }
    }
  }
}

async function placeStep(c, t, sqs, text, wrong) {
  const left = new Set(sqs);
  const tray = () => actions([{ html: `<div class="tray">Ставим: ${pieceSVG(t, c)}${left.size > 1 ? '× ' + left.size : ''}</div>` }]);
  tray(); say(text);
  while (left.size) {
    const sq = await askSquare({
      ok: s => left.has(sqName(s)) && !G.st.b[s], hint: () => [...left], wrong: () => wrong,
      reward: t === 'P' ? [1, 1] : [2, 1], quiet: left.size > 1,
    });
    place(sqName(sq), t, c); left.delete(sqName(sq)); tray();
  }
}

async function defend(text, okList, hintMv, wrongText) {
  const m = await askMove({
    text, accept: x => okList.includes(mstr(x)), hint: hintMv,
    wrongText: wrongText || 'Так не защитишься. Защити клетку f7!',
    wrong: async () => {
      const mates = mateIn1Moves(G.st);
      if (!mates.length) return false;
      await wait(450); await doMove(mates[0]);
      oops('Ой! Это мат! Надо было защитить f7.');
      await wait(1600);
      return true;
    },
  });
  return mstr(m);
}

async function lessonEnd(fen, intro, tips, done) {
  setPos(fen);
  for (const t of intro) await tell(t);
  let moves = 0;
  const btns = [
    { label: '💡 Подсказка', cls: 'soft', onTap: () => { const h = bestMove(G.st, 4); if (h) { L.errors += 0.5; clearMarks('hint'); arrEl.innerHTML = ''; marks([h.from], 'hint'); arrow(h.from, h.to); say('Смотри на стрелку!'); } } },
  ];
  say('Твой ход!');
  for (;;) {
    actions(btns);
    const prev = G.st;
    const m = await userMove('w');
    clearMarks('hint'); arrEl.innerHTML = '';
    await doMove(m);
    const st = status(G.st);
    if (st === 'mate') { actions([]); sfx('win'); setMood('happy', 'hop'); addCoins(10); await tell(done); return; }
    let bad = null;
    if (st === 'stalemate') bad = 'Ой, это пат! Королю некуда ходить, но шаха нет — это ничья. Давай по-другому!';
    else if (legal(G.st).some(x => G.st.b[x.to])) bad = 'Осторожно! Король может съесть твою фигуру. Поставь её подальше от короля или под защиту.';
    if (bad) {
      L.errors++; oops(bad);
      await wait(2600);
      G.st = prev; setLast(null); render();
      continue;
    }
    if (st === 'check') say(pick(['Шах!', 'Шах королю!']));
    moves++;
    await wait(450);
    await doMove(bestMove(G.st, 2, 25));
    if (moves % 6 === 0) say(pick(tips));
    else if (moves === 15) say('Если трудно — нажми «Подсказка», я помогу!');
  }
}

}
async function runLesson(def) {
  abortAll(); TAP = MOVE = null; G.sel = -1;
  L = { def, errors: 0, earned: 0 };
  show('lesson'); $('#lTitle').textContent = def.name; actions([]);
  try {
    await def.run();
    await finishLesson();
  } catch (e) { if (!(e instanceof Abort)) { console.error(e); menu(); } }
}
async function finishLesson() {
  const stars = L.errors <= 1 ? 3 : L.errors <= 4 ? 2 : 1;
  addCoins(stars * 5);
  S.stars[L.def.id] = Math.max(S.stars[L.def.id] || 0, stars); save();
  $('#rStars').innerHTML = '★'.repeat(stars) + `<span class="off">${'★'.repeat(3 - stars)}</span>`;
  $('#rGot').innerHTML = `${COIN} +${L.earned}`;
  $('#result').classList.add('on');
  MOOD = 'happy'; drawLeons('hop'); sfx('win');
  speak(stars === 3 ? 'Урок пройден! Три звезды! Ты молодец!' : 'Урок пройден! Молодец!');
  const again = await waitable(res => { $('#rAgain').onclick = () => res(true); $('#rMenu').onclick = () => res(false); });
  $('#result').classList.remove('on');
  if (again) runLesson(L.def); else menu();
}

function shop() {

    const own = S.owned.includes(id), worn = S.wear[slot] === id;
    const b = document.createElement('button');
    b.className = 'item' + (own ? ' own' : '') + (worn ? ' on' : '') + (!own && S.coins < price ? ' poor' : '');

      } else if (S.coins >= price) {
        S.coins -= price; S.owned.push(id);

        save(); sfx('win'); setMood('happy', 'hop'); say('Ура, обновка! Спасибо!');

const MALON_PRICE = 100;
const MALON_SAY = ['Хрум! Это мне! Спасибо!', 'Ням! Малон доволен!', 'Хрум-хрум! Вкуснятина!', 'Я первый успел!'];
const TB = { busy: false };
const tEl = s => document.querySelector('#tbox ' + s);
function sayMalon(t) {
  const b = document.querySelector('.screen.on .bubble');
  if (b) { b.textContent = t; b.dataset.say = t; }
  speak(t, 'malon');
}
function spend(n) {
  S.coins -= n; save(); updWallet(); sfx('coin');
  const w = document.querySelector('.screen.on .wallet');
  if (w) { const f = document.createElement('span'); f.className = 'float'; f.style.color = '#e5533d'; f.textContent = '−' + n; w.appendChild(f); setTimeout(() => f.remove(), 1100); }
}
function drawTerra(lm = 'neutral', mm = 'neutral', chew = '') {
  const l = tEl('.tleon'), m = tEl('.tmalon');
  l.innerHTML = leonSVG(lm, S.wear); l.firstChild.classList.add(chew === 'L' ? 'chew' : lm === 'happy' && !chew ? 'hop' : 'idle');
  m.innerHTML = S.malon.owned ? geckoSVG(mm) : '';
  if (m.firstChild) m.firstChild.classList.add(chew === 'M' ? 'chew' : 'idle');
  m.classList.toggle('off', !malonOn());
  $('#mtog').style.display = S.malon.owned ? '' : 'none';
  $('#mtog').textContent = '🦎 Малон: ' + (S.malon.on ? 'дома' : 'гуляет');
  $('#buyMalon').style.display = S.malon.owned ? 'none' : '';
  $('#buyMalon').innerHTML = `🦎 Купить Малона ${COIN}${MALON_PRICE}`;
}
function renderFoods() {
  $('#foods').innerHTML = Object.entries(FOODS).map(([k, f]) =>
    `<button class="fd${S.coins < f.price ? ' poor' : ''}" data-f="${k}"><div class="ic">${f.svg || f.svgs.crawl}</div><b>${f.name}</b><span>${COIN}${f.price}</span></button>`).join('');
  $('#foods').querySelectorAll('.fd').forEach(b => b.onclick = () => buyFood(b.dataset.f));
}
function terra() {
  abortAll(); TAP = MOVE = null; L = null; actions([]);
  try { speechSynthesis.cancel(); } catch (e) {}
  show('terra'); drawTerra(); renderFoods();
  say(malonOn() ? 'Мы с Малоном проголодались! Выбирай угощение в банке.' : 'Я проголодался! Выбирай угощение в банке.');
}
async function buyFood(k) {
  const F = FOODS[k];
  if (TB.busy) return;
  if (S.coins < F.price) { const n = F.price - S.coins; drawTerra('sad'); say(`Нужно ещё ${n} ${coinsW(n)}. Пройди урок — и покормишь!`); return; }
  spend(F.price); renderFoods();
  await terraFeed(k);
}
function tween(ms, fn) {
  return new Promise(res => {
    const t0 = performance.now();
    const step = now => { const t = Math.min(1, (now - t0) / ms); fn(t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2); if (t < 1) requestAnimationFrame(step); else res(); };
    requestAnimationFrame(step);
  });
}
const pause = ms => new Promise(r => setTimeout(r, ms));
// букашка садится в случайное место; кто к ней ближе — тот и ест
async function terraFeed(type) {
  TB.busy = true;
  const F0 = FOODS[type], mv0 = F0.move === 'either' ? (Math.random() < .5 ? 'fly' : 'crawl') : F0.move;
  const box = $('#tbox'), F = F0.svgs ? { ...F0, move: mv0, svg: F0.svgs[mv0] } : F0, W = box.clientWidth, H = box.clientHeight;
  const leon = tEl('.tleon'), malon = tEl('.tmalon'), tg = tEl('.tongue');
  const rnd = (a, b) => a + Math.random() * (b - a);
  const px = W * .47, py = H * .887, prx = W * .157;  // лужа
  let lx, ly;
  if (F.move === 'fly') { lx = rnd(W * .12, W * .88); ly = rnd(H * .14, H * .55); }
  else if (F.move === 'swim') { lx = px + rnd(-prx * .45, prx * .45); ly = py; }
  else { lx = Math.random() < .5 ? rnd(W * .08, px - prx - 14) : rnd(px + prx + 14, W * .9); ly = rnd(H * .8, H * .92); }
  const rel = (el, kx, ky) => { const r = el.getBoundingClientRect(), s = box.getBoundingClientRect(); return [r.left - s.left - box.clientLeft + r.width * kx, r.top - s.top - box.clientTop + r.height * ky]; };
  const [mx, my] = rel(leon, .5, .62), [gx, gy] = rel(malon, .5, .6);
  const who = malonOn() && Math.hypot(lx - gx, ly - gy) < Math.hypot(lx - mx, ly - my) ? 'malon' : 'leon';
  const f = document.createElement('div'); f.className = 'food'; f.innerHTML = F.svg;
  const at = (x, y, s = 1, fl = false) => `translate(${x - 22}px, ${y - 22}px) scale(${fl ? -s : s}, ${s})`;
  const fromLeft = Math.random() < .5, sx = fromLeft ? -30 : W + 30, flip = !fromLeft;
  const sy = F.move === 'fly' ? rnd(10, H * .4) : ly;
  const frames = F.move === 'swim'
    ? [{ transform: at(W * .55, -30, .8, flip) }, { transform: at(lx + 20, H * .45, 1, flip), offset: .55 }, { transform: at(lx, ly, 1, flip) }]
    : F.move === 'hop'
      ? [{ transform: at(sx, sy, 1, flip) }, { transform: at((sx + lx) / 2, sy - 60, 1, flip) }, { transform: at(lx, ly, 1, flip) }]
      : F.move === 'fly'
        ? [{ transform: at(sx, sy, 1, flip) }, { transform: at((sx + lx) / 2, rnd(10, H * .3), 1, flip) }, { transform: at(lx + (fromLeft ? -20 : 20), ly - 20, 1, flip) }, { transform: at(lx, ly, 1, flip) }]
        : [{ transform: at(sx, sy, 1, flip) }, { transform: at(lx, ly, 1, flip) }];
  f.style.transform = at(lx, ly, 1, flip);
  box.appendChild(f);
  await f.animate(frames, { duration: F.move === 'crawl' ? 1400 : 1000, easing: F.move === 'swim' ? 'ease-in' : 'ease-out' }).finished;
  if (F.move === 'swim') {
    sfx('move');
    for (let i = 0; i < 3; i++) setTimeout(() => {
      const r = document.createElement('div'); r.className = 'ripple';
      r.style.left = lx - 12 + 'px'; r.style.top = ly - 4 + 'px'; box.appendChild(r); setTimeout(() => r.remove(), 900);
    }, i * 220);
    await f.animate([{ transform: at(lx, ly, 1, flip) }, { transform: at(lx - 14, ly + 2, 1, false) }, { transform: at(lx + 14, ly, 1, true) }, { transform: at(lx, ly, 1, flip) }], { duration: 1100 }).finished;
  }
  await pause(200);
  const heart = (x, y) => { const h = document.createElement('div'); h.className = 'heart'; h.textContent = '❤️'; h.style.left = x - 11 + 'px'; h.style.top = y - 24 + 'px'; box.appendChild(h); setTimeout(() => h.remove(), 1200); };
  if (who === 'leon') {
    drawTerra('happy', 'neutral', 'T');
    tg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    tg.innerHTML = `<line stroke="#ff6f91" stroke-width="8" stroke-linecap="round" x1="${mx}" y1="${my}" x2="${mx}" y2="${my}"/><circle r="8.5" fill="#e8456f" cx="${mx}" cy="${my}"/>`;
    const line = tg.firstChild, tip = tg.lastChild;
    const set = (x, y) => { line.setAttribute('x2', x); line.setAttribute('y2', y); tip.setAttribute('cx', x); tip.setAttribute('cy', y); };
    await tween(170, t => set(mx + (lx - mx) * t, my + (ly - my) * t));
    await tween(280, t => { const x = lx + (mx - lx) * t, y = ly + (my - ly) * t; set(x, y); f.style.transform = at(x, y, 1 - .6 * t, flip); });
    tg.innerHTML = ''; f.remove();
    sfx('chomp'); drawTerra('happy', 'neutral', 'L'); heart(mx, my - 50);
    say(F.say);
  } else {
    const dx = lx - gx, dy = ly - gy;
    drawTerra('neutral', 'happy');
    await malon.animate([{ transform: 'translate(0,0)' }, { transform: `translate(${dx * .5}px, ${dy * .5 - 50}px)` }, { transform: `translate(${dx}px, ${dy}px)` }], { duration: 380, easing: 'ease-out' }).finished;
    f.remove(); sfx('chomp');
    await malon.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: `translate(${dx * .5}px, ${dy * .5 - 40}px)` }, { transform: 'translate(0,0)' }], { duration: 420, easing: 'ease-in' }).finished;
    drawTerra('neutral', 'happy', 'M'); heart(gx, gy - 46);
    sayMalon(pick(MALON_SAY));
  }
  setTimeout(() => { if (!TB.busy && document.querySelector('#terra.on')) drawTerra(); }, 1800);
  await pause(450);
  TB.busy = false;
}
$('#buyMalon').onclick = () => {
  if (TB.busy) return;
  if (S.coins < MALON_PRICE) { const n = MALON_PRICE - S.coins; say(`Малон стоит ${MALON_PRICE} монеток. Нужно ещё ${n} ${coinsW(n)} — пройди уроки!`); return; }
  spend(MALON_PRICE); S.malon = { owned: true, on: true }; save();
  sfx('win'); drawTerra('happy', 'happy');
  sayMalon('Привет! Я Малон, друг Леона! Теперь я живу здесь.');
};
$('#mtog').onclick = () => {
  if (TB.busy) return;
  S.malon.on = !S.malon.on; save(); drawTerra();
  if (S.malon.on) sayMalon('Я вернулся! Буду рядом с Леоном.'); else say('Малон ушёл гулять. Вернётся, когда позовёшь.');
};
$('#toTerra').onclick = () => { sfx('tap'); terra(); };
$('#terraBack').onclick = () => { sfx('tap'); menu(); };

$('#back').onclick = () => { sfx('tap'); menu(); };
$('#toShop').onclick = () => { sfx('tap'); shop(); say('Это мой гардероб! Выбирай, что мне надеть.'); };
$('#shopBack').onclick = () => { sfx('tap'); menu(); };
$('#snd').onclick = () => { S.sound = !S.sound; save(); $('#snd').textContent = S.sound ? '🔊' : '🔇'; if (!S.sound) try { speechSynthesis.cancel(); } catch (e) {} };
$('#voiceBtn').onclick = () => {
  pickVoice();
  VAR = VARS[(VARS.indexOf(VAR) + 1) % VARS.length];
  S.voice = VAR.label; save();
  $('#voiceBtn').textContent = '🗣 Голос: ' + VAR.label;
  say('Привет! Я Леон. Так звучит мой голос.');
};
$('#reset').onclick = () => {
  if (!confirm('Сбросить монетки, звёзды, покупки и Малона?')) return;
  Object.assign(S, { coins: 10, owned: [], wear: { skin: 'green' }, stars: {}, malon: { owned: false, on: true } }); save(); shop();
};
$('#snd').textContent = S.sound ? '🔊' : '🔇';
menu();
</script>
